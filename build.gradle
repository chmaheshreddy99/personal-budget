plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aditya'
version = '1.0.0'
description = 'Personal Budget - multi-tenant double-entry personal finance application'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web layer (REST + static UI)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Sending reminders and receipts by e-mail (only when budget.mail is configured)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // JPA annotations (mapping metadata + constraints) and Spring Data repository contracts.
    // Persistence itself is done by our own tab-separated file store - no database needed.
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'org.springframework.data:spring-data-commons'

    // @Transactional support on top of the file store
    implementation 'org.springframework:spring-tx'

    // Password hashing only (BCrypt), not the full Spring Security stack
    implementation 'org.springframework.security:spring-security-crypto'
    // Optional storage of the tables in a Google spreadsheet (budget.storage.type: google-sheets)
    implementation 'com.google.apis:google-api-services-sheets:v4-rev20260610-2.0.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.52.0'

    // renders an ID card uploaded as a PDF into an image for the agreement
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    // Boilerplate reduction for entities (getters/setters)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Tests only ever see the built-in settings and their own temp folders: never a config/application.yml lying
    // around (it may point at real data, such as a Google spreadsheet), and never anything but file storage.
    systemProperty 'spring.config.location', 'classpath:/'
    systemProperty 'budget.storage.type', 'files'
}

// The jar reads config/application.yml next to it: ship the sample there (your own files in it are left alone)
tasks.named('bootJar') {
    doLast {
        copy {
            from 'config'
            include '*.sample'
            into layout.buildDirectory.dir('libs/config')
        }
    }
}

// Run from the project root so the ./data directory resolves to <project>/data
tasks.named('bootRun') {
    workingDir = rootProject.projectDir
}
