spring:
  application:
    name: personal-budget
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # evidence uploads are limited by budget.attachments.max-file-mb; this is the largest upload of any kind,
      # a backup file with its evidence files being the biggest (Settings, Backup)
      max-file-size: 200MB
      max-request-size: 201MB
  # E-mail for Host a Chit reminders and receipts (off until a host is set). For Gmail, turn on 2-step
  # verification and create an app password (Google account > Security > App passwords).
  # mail:
  #   host: smtp.gmail.com
  #   port: 587
  #   username: you@gmail.com
  #   password: your-16-letter-app-password
  #   properties:
  #     mail.smtp.auth: true
  #     mail.smtp.starttls.enable: true

server:
  port: 8080
  compression:
    enabled: true

budget:
  # Folder (relative to the working directory) holding one .tbl file per table; with Google Sheets storage it still
  # holds evidence attachments, settings and the lock file
  data-dir: data
  # The time zone times are recorded in (e.g. Asia/Kolkata); empty = the server's. Each organization's times are shown
  # in its own zone (Settings, Organization). Set this to the zone the data was recorded in before moving the app to a
  # server running in another zone (cloud servers often run in UTC), so the times already recorded keep their meaning.
  storage-time-zone:
  # Where the tables are stored. Override these in config/application.yml next to the jar (see config/application.yml.sample)
  storage:
    # files = tab-separated files in data-dir; google-sheets = one tab per table in a Google spreadsheet
    type: files
    google-sheets:
      # the id in the spreadsheet's address: docs.google.com/spreadsheets/d/<spreadsheet-id>/edit
      spreadsheet-id:
      # the service account's JSON key; a relative path is looked up next to the jar first, then in the working directory.
      # Share the spreadsheet with the service account's e-mail address (client_email in the key) as an Editor.
      credentials-file: config/google-credentials.json
      timeout-seconds: 30
      # When pages read the spreadsheet. -1: only saves read it (each save reads it afresh, checks against it and
      # shares what it wrote), pages are served from what was read or saved last; an edit made by hand in the
      # spreadsheet shows with the next save or a restart. A number of seconds: pages also read it again once what
      # was read is that old. 0: every request reads it.
      read-cache-seconds: -1
      # on the first start against an empty spreadsheet, copy the tables in data-dir into it
      import-local-data: false
  security:
    # Roles are always enforced: see RolePolicy for who may do what. A viewer can only read.
    session-hours: 12
    # Role given to users created without an explicit role
    default-user-role: ADMIN
    # Sign-in is locked for lock-minutes after this many wrong passwords in a row
    max-failed-logins: 5
    lock-minutes: 10
  interest:
    # Interest on money lent / owed: MONTHLY = every month counts as one month (30-day months, 30/360),
    # ACTUAL = actual days / 365
    day-count: MONTHLY
  # mail:
  #   # sender address when it is not spring.mail.username, and where members' replies go
  #   from: chits@example.com
  #   reply-to: you@example.com
  backup:
    # JSON backups of the whole data (Settings, Backup): the folder, relative to the app's root (the folder holding
    # config/: next to the jar, or the project root), and how many to keep (the oldest go first; 0 keeps every one)
    dir: backups
    keep: 30
  attachments:
    # Evidence (photos, scans, PDFs) attached to entries, stored under <data-dir>/attachments
    max-file-mb: 10
    max-per-entry: 12
  seed:
    # On first start (no tenants yet) create a default tenant and admin login
    admin-username: admin
    admin-password: admin@123
    tenant-code: home
    tenant-name: My Household
    currency: INR
    # Also generate six months of sample transactions, accounts and a chit
    demo-data: false

logging:
  level:
    com.aditya.personalbudget: INFO
